model: kgat
dataset: amazonbook
embedding_size: 64
learning_rate: 0.0001
train_batch_size: 1024
stopping_step: 20
metrics: [Recall, NDCG, MRR]
topk: [10, 20]
valid_metric: Recall@20
train_neg_sample_args:
  distribution: uniform
  sample_num: 1
benchmark_filename: [train, valid, test]
kg_file: full

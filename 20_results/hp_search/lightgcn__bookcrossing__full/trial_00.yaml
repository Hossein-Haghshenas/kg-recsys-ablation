model: lightgcn
dataset: bookcrossing
kg_file: full
embedding_size: 64
n_layers: 3
reg_weight: 0.0001
require_pow: true
learning_rate: 0.001
train_neg_sample_args:
  distribution: uniform
  sample_num: 1
stopping_step: 20
metrics:
- Recall
- NDCG
- MRR
topk:
- 10
- 20
valid_metric: Recall@20
benchmark_filename:
- train
- valid
- test
